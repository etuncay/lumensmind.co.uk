# Lumensmind monorepo — nginx (3 statik site)
# Web kökü: her paket dizini (HTML). Varlıklar: export/, assets/ (alias).
# Kurulum: deploy/lumensmind.sh setup

# --- lumensmind.co.uk (marketing) ---
server {
    listen 80;
    listen [::]:80;
    server_name lumensmind.co.uk www.lumensmind.co.uk;

    root __REPO_DIR__/lumensmind.co.uk;
    index index.html;

    access_log /var/log/nginx/lumensmind.co.uk.access.log;
    error_log /var/log/nginx/lumensmind.co.uk.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location /export/ {
        alias __REPO_DIR__/lumensmind.co.uk/export/;
    }

    location /assets/ {
        alias __REPO_DIR__/lumensmind.co.uk/assets/;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

