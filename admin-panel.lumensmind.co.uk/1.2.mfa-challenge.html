[\"$\",\"title\",\"2\",{\"children\":\"Lumensmind - Platform Admin\"}],[\"$\",\"meta\",\"3\",{\"name\":\"description\",\"content\":\"Platform administration console\"}],[\"$\",\"link\",\"4\",{\"rel\":\"icon\",\"href\":\"/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"16x16\"}],[\"$\",\"meta\",\"5\",{\"name\":\"next-size-adjust\"}]]\n5:null\n"])</script><script>
(function () {
  "use strict";
  var form = document.getElementById("static-mfa-form");
  if (!form) return;

  var input = document.getElementById("mfa-code");
  var label = document.getElementById("mfa-code-label");
  var help = document.getElementById("mfa-help");
  var error = document.getElementById("mfa-error");
  var submit = document.getElementById("mfa-submit");
  var toggle = document.getElementById("mfa-mode-toggle");
  var mode = "totp";

  function normalizedRecoveryCode(value) {
    return value.replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
  }

  function clearError() {
    error.textContent = "";
    error.classList.add("hidden");
    input.removeAttribute("aria-invalid");
  }

  function showError(message) {
    error.textContent = message;
    error.classList.remove("hidden");
    input.setAttribute("aria-invalid", "true");
    input.focus();
  }

  function isComplete() {
    return mode === "totp" ? /^\d{6}$/.test(input.value) : normalizedRecoveryCode(input.value).length >= 8;
  }

  function updateSubmitState() {
    submit.disabled = !isComplete();
  }

  input.addEventListener("input", function () {
    clearError();
    if (mode === "totp") {
      input.value = input.value.replace(/\D/g, "").slice(0, 6);
    } else {
      input.value = input.value.replace(/[^a-zA-Z0-9-]/g, "").toUpperCase().slice(0, 16);
    }
    updateSubmitState();
  });

  toggle.addEventListener("click", function () {
    mode = mode === "totp" ? "recovery" : "totp";
    clearError();
    input.value = "";
    input.maxLength = mode === "totp" ? 6 : 16;
    input.inputMode = mode === "totp" ? "numeric" : "text";
    input.autocomplete = mode === "totp" ? "one-time-code" : "off";
    input.placeholder = mode === "totp" ? "000000" : "XXXX-XXXX";
    input.classList.toggle("uppercase", mode === "recovery");
    label.textContent = mode === "totp" ? "Authentication code" : "Recovery code";
    help.textContent = mode === "totp" ? "Enter the current code from your authenticator app." : "Enter a one-time recovery code for your admin account.";
    toggle.textContent = mode === "totp" ? "Use recovery code" : "Back to authentication code";
    updateSubmitState();
    input.focus();
  });

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    clearError();

    if (!isComplete()) {
      showError(mode === "totp" ? "Enter the 6-digit code from your authenticator app." : "Enter a valid recovery code.");
      return;
    }

    var recoveryCode = normalizedRecoveryCode(input.value);
    if (mode === "totp" && input.value === "000000") {
      showError("Invalid verification code. Try again.");
      return;
    }
    if (mode === "recovery" && (recoveryCode === "INVALID" || recoveryCode === "00000000")) {
      showError("Recovery code is invalid or has already been used.");
      return;
    }

    submit.disabled = true;
    submit.textContent = "Verifying…";
    window.setTimeout(function () {
      window.location.href = "./3.dashboard.html";
    }, 400);
  });

  updateSubmitState();
  input.focus();
})();
</script></body></html>
