<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accept invitation | Lumensmind</title>
  <link rel="stylesheet" href="./auth-demo.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-wrap">
      <a class="brand" href="./1.1.sign-in.html"><span class="brand-mark" aria-hidden="true"></span>Lumensmind</a>
      <section class="auth-card" aria-labelledby="page-title">
        <h1 id="page-title">You’ve been invited</h1>
        <p class="lede">Join Game Studio Alpha and finish setting up your account.</p>
        <p class="status" data-page-status></p>
        <div class="identity"><strong>Ayşe Demir</strong><span>ayse@gamestudio.com · Analyst</span></div>
        <div class="notice">This is a demo invitation. Accepting or declining it does not change a real account.</div>
        <div class="button-row"><button class="button" type="button" data-invitation-action="accept">Accept invitation</button><button class="button danger" type="button" data-invitation-action="decline">Decline</button></div>
        <p class="footnote"><a href="./1.1.sign-in.html">Return to sign in</a></p>
      </section>
    </div>
  </main>
  <script src="./auth-demo.js" defer></script>
</body>
</html>
