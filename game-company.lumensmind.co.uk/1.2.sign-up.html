<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Lumensmind</title>
  <link rel="stylesheet" href="./auth-demo.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-wrap">
      <a class="brand" href="./1.1.sign-in.html"><span class="brand-mark" aria-hidden="true"></span>Lumensmind</a>
      <section class="auth-card" aria-labelledby="page-title">
        <h1 id="page-title">Create your account</h1>
        <p class="lede">Set up a Lumensmind account for your studio.</p>
        <form class="stack" data-auth-action="sign-up">
          <p class="status" data-auth-status></p>
          <div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required></div>
          <div class="field"><label for="email">Work email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="ornek@firma.com" required></div>
          <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><span class="helper">Use at least eight characters.</span></div>
          <label class="check-row"><input name="terms" type="checkbox" required><span>I agree to the Terms of Service and Privacy Policy.</span></label>
          <button class="button full" type="submit">Create account</button>
        </form>
        <p class="footnote">Already have an account? <a href="./1.1.sign-in.html">Sign in</a></p>
      </section>
    </div>
  </main>
  <script src="./auth-demo.js" defer></script>
</body>
</html>
