<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | Lumensmind</title>
  <link rel="stylesheet" href="./auth-demo.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-wrap">
      <a class="brand" href="./1.1.sign-in.html"><span class="brand-mark" aria-hidden="true"></span>Lumensmind</a>
      <section class="auth-card" aria-labelledby="page-title">
        <h1 id="page-title">Reset your password</h1>
        <p class="lede">Choose a new password for your account.</p>
        <form class="stack" data-auth-action="reset-password">
          <p class="status" data-auth-status></p>
          <div class="notice">This demo accepts a valid password locally and does not update a real account.</div>
          <div class="field"><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><span class="helper">Use at least eight characters.</span></div>
          <div class="field"><label for="confirm-password">Confirm new password</label><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div>
          <button class="button full" type="submit">Update password</button>
        </form>
        <p class="footnote"><a href="./1.1.sign-in.html">Return to sign in</a></p>
      </section>
    </div>
  </main>
  <script src="./auth-demo.js" defer></script>
</body>
</html>
