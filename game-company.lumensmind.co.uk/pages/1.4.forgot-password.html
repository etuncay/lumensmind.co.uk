<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password | Lumensmind</title>
  <link rel="stylesheet" href="./auth-demo.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-wrap">
      <a class="brand" href="./1.1.sign-in.html"><span class="brand-mark" aria-hidden="true"></span>Lumensmind</a>
      <section class="auth-card" aria-labelledby="page-title">
        <h1 id="page-title">Forgot password?</h1>
        <p class="lede">Enter your email address to request a reset link.</p>
        <form class="stack" data-auth-action="forgot-password">
          <p class="status" data-auth-status></p>
          <div class="notice">This is a demo flow. No email will be sent.</div>
          <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="ornek@firma.com" required></div>
          <button class="button full" type="submit">Send reset link</button>
        </form>
        <p class="footnote"><a href="./1.1.sign-in.html">Return to sign in</a></p>
      </section>
    </div>
  </main>
  <script src="./auth-demo.js" defer></script>
</body>
</html>
