<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two-factor authentication | Lumensmind</title>
  <link rel="stylesheet" href="./auth-demo.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-wrap">
      <a class="brand" href="./1.1.sign-in.html"><span class="brand-mark" aria-hidden="true"></span>Lumensmind</a>
      <section class="auth-card" aria-labelledby="page-title">
        <h1 id="page-title">Two-factor authentication</h1>
        <p class="lede">Enter the six-digit code from your authenticator app.</p>
        <form class="stack" data-auth-action="mfa">
          <p class="status" data-auth-status></p>
          <div class="notice">Demo behavior: any six-digit code is accepted except <strong>000000</strong>, which displays an error.</div>
          <div class="field"><label for="code">Authentication code</label><input class="code-input" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required></div>
          <button class="button full" type="submit">Verify</button>
        </form>
        <p class="footnote"><a href="./1.1.sign-in.html">Cancel and return to sign in</a></p>
      </section>
    </div>
  </main>
  <script src="./auth-demo.js" defer></script>
</body>
</html>
