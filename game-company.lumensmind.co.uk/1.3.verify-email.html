<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify email | Lumensmind</title>
  <link rel="stylesheet" href="./auth-demo.css">
</head>
<body>
  <main class="auth-shell">
    <div class="auth-wrap">
      <a class="brand" href="./1.1.sign-in.html"><span class="brand-mark" aria-hidden="true"></span>Lumensmind</a>
      <section class="auth-card" aria-labelledby="page-title">
        <h1 id="page-title">Verify your email</h1>
        <p class="lede">Activate your account by confirming your email address.</p>
        <p class="status" data-page-status></p>
        <div class="notice">This demo assumes that you opened a valid verification link. No email is sent and no server request is made.</div>
        <div class="identity"><strong>Email ready for verification</strong><span>ornek@firma.com</span></div>
        <div class="button-row"><a class="button" href="./1.1.sign-in.html">Continue to sign in</a><button class="button secondary" type="button" data-resend-verification>Resend email</button></div>
      </section>
    </div>
  </main>
  <script src="./auth-demo.js" defer></script>
</body>
</html>
